[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testskill-finder-mcp"
version = "0.1.0"
description = "MCP server that makes the skills/ folder (56 testing skills) searchable by any LLM client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastmcp>=4.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
testskill-finder-mcp = "server:main"

# Flat layout: two top-level modules.
[tool.setuptools]
py-modules = ["server", "skillindex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
